services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowstate
      POSTGRES_PASSWORD: flowstate
      POSTGRES_DB: flowstate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowstate -d flowstate"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
